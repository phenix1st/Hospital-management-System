<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>LazyCoder || Patient Welcome</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  
  <style>
    body {
      padding-left: 240px;
    }

    main {
      position: relative;
      height: 100vh;
    }

    .menu {
      background: #5bc995;
      height: 100vh;
      width: 240px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5;
      outline: none;
    }

    .menu .avatar {
      background: rgba(0, 0, 0, 0.1);
      padding: 2em 0.5em;
      text-align: center;
    }

    .menu .avatar img {
      width: 100px;
      border-radius: 50%;
      border: 4px solid #ffea92;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    .menu .avatar h2 {
      font-weight: normal;
      margin-bottom: 0;
    }

    .menu ul {
      list-style: none;
      padding: 0.5em 0;
      margin: 0;
    }

    .menu ul li {
      padding: 0.5em 1em 0.5em 3em;
      font-size: 0.95em;
      font-weight: 400;
      background-repeat: no-repeat;
      background-position: left 15px center;
      background-size: auto 20px;
      transition: all 0.15s linear;
      cursor: pointer;
    }

    .menu ul li:hover {
      background-color: rgba(0, 0, 0, 0.1);
    }

    .jumbotron {
      margin-top: 80px;
      margin-bottom: 0;
      text-align: center;
    }

    .jumbotron h1 {
      font-size: 3rem;
    }

    footer {
      padding: 20px;
      background: black;
      color: white;
      text-align: center;
    }

    .fa {
      font-size: 23px;
      width: 60px;
      text-align: center;
      text-decoration: none;
      margin: 5px 2px;
      border-radius: 50%;
      color: white;
    }

    .fa:hover {
      opacity: 0.7;
      text-decoration: none;
    }

    .fa-facebook {
      background: #3B5998;
    }

    .fa-whatsapp {
      background: #25d366;
    }

    .fa-twitter {
      background: #55ACEE;
    }

    .fa-instagram {
      background: #125688;
    }
  </style>
</head>

<body>
  <!-- Sidebar Menu -->
  <nav class="menu" tabindex="0">
    <header class="avatar">
      <img src="{% static 'images/patient_avatar.png' %}" alt="Patient Avatar" />
      <br><br>
      <h6>Patient</h6>
      <h2>Welcome</h2>
    </header>
    <ul>
      <li><a style="color:white; text-decoration:none;" href="/patientlogin"><span>Login</span></a></li>
      <li><a style="color:white; text-decoration:none;" href="/patientsignup"><span>Register</span></a></li>
    </ul>
  </nav>

  <main>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark fixed-top" style="background:#337AB7;">
      <a href="/" class="navbar-brand">HOSPITAL MANAGEMENT</a>
      <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
      </button>
    </nav>

    <!-- Jumbotron Welcome -->
    <div class="jumbotron">
      <h1 class="display-4">Hello, Patient</h1>
      <p class="lead">Welcome to Hospital Management System.</p>
      <hr class="my-4">
      <p>You can access various features after Login/SignUp.</p>
      <p class="lead">
        <a class="btn btn-primary btn-lg" href="/patientsignup" role="button">Register Your Account</a>
        <a class="btn btn-primary btn-lg" href="/patientlogin" role="button">Login</a>
      </p>
    </div>

    <!-- Footer -->
    <footer>
      <p>
        <a href="https://facebook.com/sumit.luv/" class="fa fa-facebook"></a>
        <a href="https://api.whatsapp.com/send?phone=919572181024" class="fa fa-whatsapp"></a>
        <a href="https://instagram.com/sumit.luv" class="fa fa-instagram"></a>
        <a href="https://twitter.com/sumitkumar1503" class="fa fa-twitter"></a>
      </p>
      <p>Made in India <br> Copyright &copy; 2020 LazyCoder</p>
    </footer>
  </main>
</body>

</html>
