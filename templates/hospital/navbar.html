{% load static %}
{% load i18n %}

<nav class="navbar navbar-expand-lg navbar-dark fixed-top medicare-navbar">
  <div class="container">

    <!-- BRAND -->
    <a class="navbar-brand font-weight-bold" href="{% url 'home' %}">
      🏥 MediCare
    </a>

    <!-- TOGGLER -->
    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#medicareNavbar"
      aria-controls="medicareNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- LINKS -->
    <div class="collapse navbar-collapse" id="medicareNavbar">

      <!-- LEFT -->
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'adminclick' %}">{% trans "Admin" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'doctorclick' %}">{% trans "Doctor" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'patientclick' %}">{% trans "Patient" %}</a>
        </li>
      </ul>

      <!-- RIGHT -->
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'aboutus' %}">{% trans "About" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contactus' %}">{% trans "Contact" %}</a>
        </li>

        <!-- LANGUAGE DROPDOWN -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button"
             data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            🌐 {% get_current_language as LANGUAGE_CODE %}{{ LANGUAGE_CODE|upper }}
          </a>
          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="languageDropdown">
            <a class="dropdown-item" href="{% url 'set_language' %}?language=en">English</a>
            <a class="dropdown-item" href="{% url 'set_language' %}?language=fr">Français</a>
            <a class="dropdown-item" href="{% url 'set_language' %}?language=ar">العربية</a>
          </div>
        </li>

      </ul>
    </div>
  </div>
</nav>

<style>
.medicare-navbar {
  background: linear-gradient(135deg, #667eea, #764ba2);
  padding: 14px 0;
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.medicare-navbar .navbar-brand { font-size: 1.4rem; letter-spacing: 0.5px; }
.medicare-navbar .nav-link { font-size: 1rem; font-weight: 500; margin: 0 8px; color: rgba(255,255,255,0.9) !important; transition: 0.3s; }
.medicare-navbar .nav-link:hover { color: #ffffff !important; text-decoration: underline; }
body { padding-top: 80px; }
</style>
